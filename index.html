<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>声学相机</title>
</head>
<body>

<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <button class="collapse-btn" id="btn-collapse" aria-label="收起侧边栏">
        <svg class="ico-collapse" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2"></rect>
          <path d="M9 3v18"></path>
          <path d="m16 15-3-3 3-3"></path>
        </svg>
        <svg class="ico-expand" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2"></rect>
          <path d="M9 3v18"></path>
          <path d="m14 9 3 3-3 3"></path>
        </svg>
      </button>

      <div class="brand-wrap">
        <div class="logo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="2" width="6" height="12" rx="3"></rect>
            <path d="M5 10a7 7 0 0 0 14 0M12 18v4"></path>
          </svg>
        </div>
        <b class="brand">声学相机</b>
      </div>
    </div>

    <nav class="nav">
      <div class="nav-group">
        <p class="nav-label">分析</p>
        <ul>
          <li>
            <button class="nav-item active" data-view="live" data-label="实时显示">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="13" rx="2"></rect>
                <path d="M8 21h8"></path>
              </svg>
              <span>实时显示</span>
            </button>
          </li>
          <li>
            <button class="nav-item" data-view="record" data-label="录制回放">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M10 8.5l5.5 3.5L10 15.5z" fill="currentColor" stroke="none"></path>
              </svg>
              <span>录制回放</span>
            </button>
          </li>
        </ul>
      </div>

      <div class="nav-group">
        <p class="nav-label">配置</p>
        <ul>
          <li>
            <button class="nav-item" data-view="calib" data-label="阵列标定">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="12" cy="12" r="8"></circle>
                <path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path>
              </svg>
              <span>阵列标定</span>
            </button>
          </li>
          <li>
            <button class="nav-item" data-view="device" data-label="设备设置">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M4 6h16M4 12h16M4 18h16"></path>
                <circle cx="9" cy="6" r="2" fill="#fff"></circle>
                <circle cx="15" cy="12" r="2" fill="#fff"></circle>
                <circle cx="7" cy="18" r="2" fill="#fff"></circle>
              </svg>
              <span>设备设置</span>
            </button>
          </li>
        </ul>
      </div>
    </nav>

    <div class="sidebar-foot">
      <div class="info-row"><span>阵列通道</span><b>8</b></div>
      <div class="info-row"><span>采样率</span><b>48 kHz</b></div>
      <div class="info-row"><span>阵元半径</span><b>44.2 mm</b></div>
      <div class="info-row"><span>渲染帧率</span><b id="fps-side">—</b></div>

      <button class="btn btn-primary" id="btn-toggle">
        <span class="btn-label">暂停采集</span>
        <svg class="btn-ico ico-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <rect x="7" y="5" width="3.4" height="14" rx="1.2"></rect>
          <rect x="13.6" y="5" width="3.4" height="14" rx="1.2"></rect>
        </svg>
        <svg class="btn-ico ico-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5.2v13.6L19 12z"></path>
        </svg>
      </button>
    </div>
  </aside>

  <main class="screen">
    <canvas id="heat"></canvas>
  </main>

</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
