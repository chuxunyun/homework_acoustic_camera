<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>声学相机</title>
  <link rel="icon" href="/logo.png">
</head>
<body>

<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <button class="collapse-btn" id="btn-collapse" aria-label="收起侧边栏">
        <svg class="ico-collapse" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2"></rect>
          <path d="M9 3v18"></path>
          <path d="m16 15-3-3 3-3"></path>
        </svg>
        <svg class="ico-expand" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2"></rect>
          <path d="M9 3v18"></path>
          <path d="m14 9 3 3-3 3"></path>
        </svg>
      </button>

      <div class="brand-wrap">
        <img class="logo" src="/logo.png" alt="">
        <b class="brand">声学相机</b>
      </div>
    </div>

    <nav class="nav">
      <div class="nav-group">
        <p class="nav-label">分析</p>
        <ul>
          <li>
            <button class="nav-item active" data-view="live" data-label="实时显示">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="13" rx="2"></rect>
                <path d="M8 21h8"></path>
              </svg>
              <span>实时显示</span>
            </button>
          </li>
          <li>
            <button class="nav-item" data-view="record" data-label="录制回放">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M10 8.5l5.5 3.5L10 15.5z" fill="currentColor" stroke="none"></path>
              </svg>
              <span>录制回放</span>
            </button>
          </li>
        </ul>
      </div>

      <div class="nav-group">
        <p class="nav-label">配置</p>
        <ul>
          <li>
            <button class="nav-item" data-view="calib" data-label="阵列标定">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="12" cy="12" r="8"></circle>
                <path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path>
              </svg>
              <span>阵列标定</span>
            </button>
          </li>
          <li>
            <button class="nav-item" data-view="device" data-label="设备设置">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M4 6h16M4 12h16M4 18h16"></path>
                <circle cx="9" cy="6" r="2" fill="#fff"></circle>
                <circle cx="15" cy="12" r="2" fill="#fff"></circle>
                <circle cx="7" cy="18" r="2" fill="#fff"></circle>
              </svg>
              <span>设备设置</span>
            </button>
          </li>
        </ul>
      </div>

      <div class="nav-group">
        <p class="nav-label">说明</p>
        <ul>
          <li>
            <button class="nav-item" data-view="principle" data-label="原理分析">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12h4l3-8 4 16 3-8h4"></path>
              </svg>
              <span>原理分析</span>
            </button>
          </li>
        </ul>
      </div>
    </nav>

    <div class="sidebar-foot">
      <div class="info-row"><span>阵列通道</span><b>8</b></div>
      <div class="info-row"><span>采样率</span><b>48 kHz</b></div>
      <div class="info-row"><span>阵元半径</span><b>44.2 mm</b></div>
      <div class="info-row"><span>渲染帧率</span><b id="fps-side">—</b></div>

      <button class="btn btn-primary" id="btn-toggle">
        <span class="btn-label">暂停采集</span>
        <svg class="btn-ico ico-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <rect x="7" y="5" width="3.4" height="14" rx="1.2"></rect>
          <rect x="13.6" y="5" width="3.4" height="14" rx="1.2"></rect>
        </svg>
        <svg class="btn-ico ico-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5.2v13.6L19 12z"></path>
        </svg>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="views">

      <section class="view view-live" data-view="live">
        <canvas id="heat"></canvas>
      </section>

      <section class="view view-scroll" data-view="principle" hidden>
        <div class="pgrid">

          <div class="pcol">
            <section class="pcard">
              <div class="pcard-head">
                <h3>物理场景</h3>
                <p>波前到达各阵元的时间差</p>
              </div>
              <div class="pcard-body">
                <canvas id="physicsCanvas" width="500" height="300"></canvas>
              </div>
            </section>

            <section class="pcard">
              <div class="pcard-head">
                <h3>空间谱 · 波束图</h3>
                <p>主瓣越窄，方位分辨力越高</p>
              </div>
              <div class="pcard-body">
                <canvas id="responseCanvas" width="400" height="250"></canvas>
              </div>
            </section>
          </div>

          <div class="pcol">
            <section class="pcard">
              <div class="pcard-head">
                <h3>信号处理 · Delay &amp; Sum</h3>
                <p><i class="lg lg-src"></i>原始信号　<i class="lg lg-scan"></i>校正信号　先对齐再叠加</p>
              </div>
              <div class="pcard-body">
                <canvas id="signalCanvas" width="500" height="400"></canvas>
              </div>
            </section>
          </div>

          <div class="pcol">
            <section class="pcard">
              <div class="pcard-head">
                <h3>控制</h3>
                <p>拖动滑块观察波束变化</p>
              </div>
              <div class="pcard-body">
                <div class="field">
                  <div class="field-head">
                    <label for="sourceAngleInput">声源角度</label>
                    <span class="val val-src"><b id="sourceAngleVal">30</b>°</span>
                  </div>
                  <input class="range range-src" type="range" id="sourceAngleInput" min="-80" max="80" value="30">
                </div>

                <div class="field">
                  <div class="field-head">
                    <label for="scanAngleInput">扫描角度</label>
                    <span class="val val-scan"><b id="scanAngleVal">30</b>°</span>
                  </div>
                  <input class="range range-scan" type="range" id="scanAngleInput" min="-80" max="80" value="30">
                  <p class="hint">对准声源时蓝线重合，Σ 输出最大</p>
                </div>

                <div class="field">
                  <div class="field-head">
                    <label for="numMicsInput">麦克风数量</label>
                    <span class="val"><b id="numMicsVal">8</b></span>
                  </div>
                  <input class="range" type="range" id="numMicsInput" min="2" max="16" value="8">
                </div>

                <div class="field-actions">
                  <button class="btn-sm" id="autoLockBtn">自动锁定声源</button>
                  <button class="btn btn-primary btn-block" id="togglePlayBtn">暂停动画</button>
                </div>
              </div>
            </section>
          </div>

        </div>
      </section>

      <section class="view view-scroll" data-view="empty" hidden>
        <div class="empty">
          <h3 id="empty-title">录制回放</h3>
          <p>该模块尚未实现</p>
        </div>
      </section>

    </div>
  </main>

</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
